<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remízy</title>
<meta name="apple-mobile-web-app-title" content="Remízy">
<meta name="application-name" content="Remízy">
<meta name="theme-color" content="#0F1C2E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0F1C2E; color: #EAF2F8;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  img { width: 96px; height: 96px; border-radius: 22px; }
  a { display: inline-block; margin-top: 16px; padding: 12px 22px; border-radius: 10px; background: #4C8DF0; color: #fff;
      text-decoration: none; font-weight: 600; }
  p { color: #93A9BF; max-width: 34ch; }
</style>
</head>
<body>
<main>
  <img src="apple-touch-icon.png" alt="">
  <h1 style="margin:12px 0 0;font-size:24px">Remízy</h1>
  <p id="msg">Otváram appku…</p>
  <a id="go" href="#" hidden>Otvoriť appku</a>
</main>
<script>
  // Sem vlož adresu webovej aplikácie z Apps Scriptu (končí na /exec):
  const APP_URL = 'SEM_VLOZ_ADRESU_APPKY';

  const ok = /^https:\/\/script\.google\.com\/.+\/exec/.test(APP_URL);
  const go = document.getElementById('go');
  if (ok) {
    go.href = APP_URL; go.hidden = false;
    location.replace(APP_URL);
  } else {
    document.getElementById('msg').textContent =
      'Chýba adresa appky. V súbore index.html na GitHube doplň APP_URL (adresa webovej aplikácie z Apps Scriptu, končí na /exec).';
  }
</script>
</body>
</html>
